<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO meta tags — change these to match your app name and domain -->
    <title>Splito — Split expenses with roommates</title>
    <meta name="description" content="Split expenses fairly with roommates. Pay via native UPI links. Free forever. No downloads." />
    <meta name="keywords" content="Split bills, Splitwise alternative India, UPI Expense Splitter, roommate expenses, PWA split bills" />

    <!-- Open Graph — controls how your link looks when shared on WhatsApp, Twitter etc -->
    <meta property="og:title" content="Splito — Split expenses with roommates" />
    <meta property="og:description" content="Split bills fairly. Pay instantly via native UPI deep links on PhonePe and GPay." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://splito-app-98600.web.app/" />
    <!-- Replace with your actual hosted image (1200x630px recommended) -->
    <meta property="og:image" content="https://splito-app-98600.web.app/icon-512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://splito-app-98600.web.app/">
    <meta property="twitter:title" content="Splito - Free UPI Expense Splitter">
    <meta property="twitter:description" content="Split bills with roommates seamlessly. No active downloads required.">
    <meta property="twitter:image" content="https://splito-app-98600.web.app/icon-512.png">

    <!-- Canonical Setup -->
    <link rel="canonical" href="https://splito-app-98600.web.app/" />

    <!-- PWA manifest — makes the app installable on phone home screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Fonts — DM Sans (UI) + DM Mono (numbers/amounts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

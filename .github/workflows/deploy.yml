# ─────────────────────────────────────────────────────────────
# .github/workflows/deploy.yml
#
# Automatically builds and deploys the app to Firebase Hosting
# every time you push to the main branch.
#
# Setup steps:
# 1. Run: firebase login:ci
#    Copy the token it outputs.
# 2. In GitHub: Settings → Secrets → Actions → New repository secret
#    Name:  FIREBASE_TOKEN
#    Value: (paste the token from step 1)
# 3. Add your Firebase env vars as secrets too (same place):
#    VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, etc.
# ─────────────────────────────────────────────────────────────

name: Build and Deploy

on:
  push:
    branches:
      - main       # triggers on every push to main
  pull_request:
    branches:
      - main       # runs checks on PRs (but doesn't deploy)

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the app
      # Firebase env vars are injected from GitHub Secrets
      # Vite reads them via import.meta.env at build time
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 5. Deploy to Firebase Hosting (only on push to main, not PRs)
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:        ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId:        live
          projectId:        ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
